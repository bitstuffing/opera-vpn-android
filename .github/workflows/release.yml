name: Release

# Two ways to publish:
#   * A commit on master: the Tests workflow must finish successfully first
#     (workflow_run trigger), then a snapshot release v1.0.<run>-<attempt> is
#     created from the exact commit that passed.
#   * A v* tag (or a manual dispatch with an existing tag): a normal semver
#     release is created/updated for that tag.
# Nothing is sent to Google Play.
on:
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v1.2.3
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve release metadata
    # A master push reaches this workflow only through Tests. If that run
    # failed or was cancelled, skip everything quietly instead of publishing.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      sha: ${{ steps.meta.outputs.sha }}
      snapshot: ${{ steps.meta.outputs.snapshot }}
    steps:
      - name: Derive tag / version / commit
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            # Master commit: build the SHA that actually passed Tests, not
            # whatever master points at by the time the build starts.
            sha="$TESTED_SHA"
            tag="v1.0.${RUN_NUMBER}-${RUN_ATTEMPT}"
            snapshot=true
          else
            # Tag push or manual dispatch with an existing tag.
            sha="$EVENT_SHA"
            tag="${INPUT_TAG:-$REF_NAME}"
            snapshot=false
          fi

          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic tag like v1.2.3, got '$tag'" >&2
            exit 1
          fi
          IFS='.' read -r major minor patch _ <<< "$version"
          patch="${patch%%[!0-9]*}"
          code=$(( 10#$major * 10000 + 10#$minor * 100 + 10#$patch ))

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          echo "Release $tag -> versionName=$version versionCode=$code sha=$sha (snapshot=$snapshot)"

  build:
    name: Build release artifacts
    needs: version
    uses: ./.github/workflows/build-apks.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      version_name: ${{ needs.version.outputs.version_name }}
      version_code: ${{ needs.version.outputs.version_code }}

  publish:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v6
        with:
          name: apks
          path: release-assets

      - name: Verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/app-debug.apk
          test -s release-assets/app-release-unsigned.apk
          (cd release-assets && sha256sum -c checksums.txt)
          ls -lh release-assets

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          # Creates the snapshot tag at the tested commit. Ignored for tags
          # that already exist (the v* / manual release case).
          target_commitish: ${{ needs.version.outputs.sha }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.snapshot == 'true' }}
          body: |
            ${{ needs.version.outputs.snapshot == 'true' && 'Automated snapshot from `master`, published only after the Tests workflow passed on this commit.' || 'Stable release built from the `v*` tag.' }}

            Android VPN client for Opera's private tunnel. Requires Android 12+ (API 31).
            Regions: **AM**, **EU**, **AS**.

            | Asset | What it is |
            | --- | --- |
            | `app-debug.apk` | Installable build, signed with Android's generated debug key. |
            | `app-release-unsigned.apk` | Optimised release build **without a signature**; sign it with `apksigner` before installing. |
            | `checksums.txt` | SHA-256 hashes — verify with `sha256sum -c checksums.txt`. |

            See `README.md` for architecture, DNS lists, diagnostics and known limitations.
          files: |
            release-assets/app-debug.apk
            release-assets/app-release-unsigned.apk
            release-assets/checksums.txt
          fail_on_unmatched_files: true
