name: Build artifacts

# Produces downloadable APKs for every push/PR without publishing anything.
# The same reusable workflow is called by release.yml for tagged builds.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name embedded in the APKs (e.g. 1.2.3)
        type: string
        required: false
        default: '1.0'
      version_code:
        description: Numeric version code embedded in the APKs
        type: string
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apks:
    name: Assemble APKs
    uses: ./.github/workflows/build-apks.yml
    with:
      version_name: ${{ github.event.inputs.version_name || '1.0' }}
      version_code: ${{ github.event.inputs.version_code || '1' }}
