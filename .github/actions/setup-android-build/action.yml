name: Set up Android build
description: Installs JDK 17, the Android SDK packages this project needs, and prepares Gradle.

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        log-accepted-android-sdk-licenses: 'false'
        # compileSdk is 37.1 (minorApiLevel = 1) and AGP 9.2 defaults to build tools 37.
        packages: 'platforms;android-37.1 build-tools;37.0.0 platform-tools'

    - name: Make Gradle wrapper executable
      shell: bash
      run: chmod +x ./gradlew

    - name: Set up Gradle caching
      uses: gradle/actions/setup-gradle@v6
